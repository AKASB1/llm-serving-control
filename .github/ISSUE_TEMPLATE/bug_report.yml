name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you saw.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The exact commands, configuration files, and seeds.
      render: bash
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit and Go version
      placeholder: "commit abc1234, go1.23"
